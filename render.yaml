services:
  # Web Service running full-stack Express + React SPA
  - type: web
    name: campusfix
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@campusfix.edu
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Campus Facilities Administrator

databases:
  # Managed PostgreSQL Database on Render
  - name: campusfix-db
    plan: free
    region: oregon
    databaseName: campusfix
    user: campusfix_user
